# CI — Linux x86_64에서 확인한다 (docs/05-roadmap.md 원칙: "내 PC에서 된다"는 완료가 아니다).
#
# 러너는 GitHub이 띄우는 VM이다. ubuntu-latest는 x86_64이고 개발 PC(aarch64 Linux)와 다른
# 환경이라, 여기서 처음 드러나는 문제가 있다.
#
# **Windows 잡은 걷었다** ([ADR-0144](../../docs/decisions/0144-remove-the-pc-runner.md) — PC 실행기를
# 걷어 볼 클라이언트가 없다). 크로스플랫폼 코드 규칙은 그대로이고, Windows 쪽 타입은
# `mypy --platform win32`가, 인코딩 실수는 `tests/integration/test_generators_on_windows_encoding.py`가
# **Linux에서** 본다.
name: CI

# main에 푸시할 때는 돌리지 않는다 — 머지 전에 PR에서 이미 한 번 돌았다 (CI는 PR당 한 번).
on:
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 앞의 실행을 끊는다 (무료 한도 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Python은 uv가 내려받는다 (.python-version = 3.12, ADR-0005).
      # PYTHONUTF8은 **일부러 켜지 않는다** — Windows 기본 인코딩에서 돌려야
      # `encoding="utf-8"`을 빠뜨린 곳이 드러난다 (CLAUDE.md §5).
      #
      # setup-uv는 떠 있는 메이저 태그(v10)가 없어 정확한 버전으로 고정한다.
      # 올릴 때는 이 줄을 손으로 고친다.
      - name: uv 설치
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Python 3.12 (uv 관리형)
        run: uv python install

      # --frozen: uv.lock을 그대로 쓴다. lock이 pyproject와 어긋나면 여기서 멈춘다.
      - name: 의존성
        run: uv sync --all-packages --frozen

      - name: 테스트
        run: uv run pytest

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      # OS 분기는 한쪽만 검사된다 (mypy가 `sys.platform` 비교로 다른 쪽을 지운다). Windows 잡이
      # 없으므로 **여기가 Windows 쪽을 보는 유일한 자리**다 (ADR-0144 — 크로스플랫폼 규칙은 남는다).
      - name: mypy (Windows 쪽 분기)
        run: uv run mypy --platform win32

      # 생성물이 원본과 어긋나면 멈춘다. 둘 다 아무것도 쓰지 않고 검사만 한다.
      - name: 계약 JSON Schema 최신 여부
        run: uv run python scripts/gen_schemas.py --check

      # 캔버스가 `bpm:*`를 타입으로 다루는 설명 — 웹 편집기의 moddle과 속성 폼 명세를 짓는다.
      - name: bpmn-moddle 설명 최신 여부
        run: uv run python scripts/gen_moddle.py --check

      # 확장이 기여한 콘솔 화면 목록 (ADR-0042 §2 — 콘솔이 손으로 베끼지 않는다).
      - name: 콘솔 화면 기여 목록 최신 여부
        run: uv run python scripts/gen_console_pages.py --check

      - name: 업무 예제 생성물 최신 여부
        run: uv run python docs/08-business-examples/_source/build.py --check

      # 명암비 검사도 이 안에서 돈다 (기준을 깨는 색이 들어오면 1로 끝난다).
      - name: 디자인 토큰 생성물 최신 여부
        run: uv run python scripts/gen_tokens.py --check

      # 작업 트리가 더러워졌다면 생성물을 커밋하지 않은 것이다 (--check가 놓친 경우).
      - name: 작업 트리가 깨끗한가
        run: git diff --exit-code

  # 웹 화면 (ADR-0017). 파이썬 쪽과 따로 돈다 — 도구가 둘(uv + pnpm)이다.
  web:
    name: 웹
    runs-on: ubuntu-latest

    # pnpm 워크스페이스의 뿌리는 저장소 맨 위다 (ADR-0129).
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager가 정한다 (한 곳에서만 올린다).
      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Node.js LTS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --frozen-lockfile: lock이 package.json과 어긋나면 여기서 멈춘다 (uv --frozen과 같은 뜻).
      - name: 의존성
        run: pnpm install --frozen-lockfile

      # 계약 스키마에서 생성한 타입이 최신인가. 스키마 자체의 최신 여부는 Python 쪽이 본다.
      - name: 계약 타입 최신 여부
        run: pnpm check:api-types

      - name: 타입 검사
        run: pnpm typecheck

      # 콘솔 집계(CON-02)의 셈 — 화면을 모르는 함수만 잰다 (브라우저·React를 띄우지 않는다).
      - name: 단위 시험
        run: pnpm test

      - name: 빌드
        run: pnpm build

      - name: 작업 트리가 깨끗한가
        run: git diff --exit-code
