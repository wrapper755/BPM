[project]
name = "bpm-service-kit"
version = "0.1.0"
description = "서비스 앱 공통 뼈대 — 일꾼(C15 가져가기), 멱등, 관리 API, healthz (C11)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bpm-contracts",
    # 모델 클라이언트 — 엔진과 같은 한 벌 (ADR-0034). 서비스 앱은 core를 쓸 수 없다.
    "bpm-llm",
    "fastapi>=0.115",
    # 일꾼이 Center를 부른다 (C15).
    "httpx>=0.27",
]

[tool.uv.sources]
bpm-contracts = { workspace = true }
bpm-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# bpm는 PEP 420 네임스페이스 — src/bpm 밑에 __init__.py를 두지 않는다
packages = ["src/bpm"]
