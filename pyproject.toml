# uv 워크스페이스 루트 — 이 파일 자체는 패키지가 아니다 (docs/01-architecture.md §8).
# 멤버는 shared/*, server/<앱>, samples/* 각각의 pyproject.toml에 있다 (자리는 ADR-0129).
# 데스크톱은 없다 — Qt Studio는 콘솔 웹 편집기로 옮겼다 (ADR-0143, M11 조각 5).
# server/는 글롭으로 적지 않는다 — server/web·server/deploy에는 pyproject.toml이 없다.
# 확장(extensions/<id>/)은 지금 하나도 없다 — 들일 때 멤버 목록에 "extensions/*"를 다시 더한다 (ADR-0114).

[tool.uv.workspace]
members = [
    "shared/*",
    "server/center", "server/server_runner", "server/adapter_consumer", "server/service_kit",
    "server/unified_consumer",
    "samples/*",
]
# samples/는 제품이 아니다 — 업무 예제가 부르는 모의 앱이다 (01-architecture §8).
#   멤버로 둔 것은 `uv run bpm-mock-apps`로 띄우고 `tests/`가 import하기 때문이다.
#   제품 코드는 samples/를 import하지 않는다 (test_import_direction.py가 막는다).
# spikes/는 멤버가 아니다 — 제품 코드가 import하지 않는다 (CLAUDE.md §3).
# server/web/은 pnpm 워크스페이스다 (ADR-0017).

[tool.uv]
# ADR-0005: 인터프리터는 uv가 관리한다. 시스템 Python은 후보에서 뺀다.
python-preference = "only-managed"
python-downloads = "automatic"

[dependency-groups]
dev = [
    "httpx>=0.27", # fastapi TestClient
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    # 시험용 PDF를 만든다 (`pdf_text_tool` 시험). 제품에는 들어가지 않는다 — 우리는 PDF를
    # 읽기만 하고, 한글 PDF는 글꼴을 심어야 진짜 문서와 같다 (스파이크 S8).
    "fpdf2>=2.8",
]
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes", "docs/08-business-examples/_source"]

[tool.ruff.lint]
# PLW1514: 텍스트 파일을 열 때 encoding을 적지 않은 곳 (CLAUDE.md §5 — Windows 기본 인코딩은
# cp949다). 아직 미리보기 규칙이라, 다른 미리보기 규칙이 함께 켜지지 않게 explicit로 제한한다.
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "UP", "B", "PTH", "PLW1514"]

[tool.ruff.lint.isort]
known-first-party = ["bpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 시험은 제품 폴더에 나뉘어 있고(ADR-0129) 도우미는 `tests/` 바로 밑에 있다. 시험이 다른 폴더의 시험 모듈을
# 빌려 쓰기도 해서 모두를 경로에 올린다 — 모으는 순서에 따라 import가 되다 말다 하지 않게.
pythonpath = ["tests", "tests/shared", "tests/server", "tests/integration"]
addopts = "-q"
# 서버 쪽 시험(`tests/server/`) — `-m "not server"`로 뺄 수 있다 (`tests/ci_scope.py`, ADR-0129).
markers = ["server: 서버(Center·서버 실행기·일꾼) 쪽 시험 — Linux에서만 돈다"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
strict = true
# 뼈대 단계: 외부 라이브러리 타입이 없는 것은 아직 막지 않는다.
ignore_missing_imports = true
# 멤버마다 src 레이아웃이라 각 src가 모듈 경로의 뿌리다 (bpm.* 네임스페이스, ADR-0019).
# 뿌리를 알려 주지 않으면 같은 파일이 packages.contracts.src.bpm.contracts로도 보여 충돌한다.
mypy_path = [
    "shared/contracts/src",
    "shared/extension_api/src",
    "shared/core/src",
    "shared/llm/src",
    "server/service_kit/src",
    "server/server_runner/src",
    "server/adapter_consumer/src",
    "server/unified_consumer/src",
    "server/center/src",
    "samples/mock_apps/src",
]
files = ["tests", "scripts", "shared/*/src", "server/*/src", "samples/*/src"]
