<!-- BPM 정사각 기호의 원본 (스타일 가이드 §6-1, ADR-0163). 마크의 가운데 두 도형 — 태스크 → 배타 게이트웨이.
     마크가 들어갈 폭이 없는 자리(브라우저 탭 아이콘)에만 쓴다. 색은 currentColor 하나. 고친 뒤 scripts/gen_tokens.py. -->
