<!-- BPM 흐름 마크의 원본 (스타일 가이드 §6-1, ADR-0118·0163). 시작 → 태스크 → 배타 게이트웨이 → 끝.
     색은 currentColor 하나만 쓴다 — 칠하는 쪽이 primary를 준다. 선은 2.8 (1.8은 위 막대에서 흐렸다).
     고치면 정사각 기호(bpm-symbol.svg)도 같이 본다 — 가운데 두 도형 그대로다. 고친 뒤 scripts/gen_tokens.py를 돌린다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 28">
  <circle cx="8" cy="14" r="5.6" fill="none" stroke="currentColor" stroke-width="2.8"/>
  <line x1="14" y1="14" x2="24" y2="14" stroke="currentColor" stroke-width="2.8"/>
  <rect x="23" y="4" width="26" height="20" rx="5" fill="currentColor"/>
  <line x1="48" y1="14" x2="57" y2="14" stroke="currentColor" stroke-width="2.8"/>
  <path d="M66 4.5 L75.5 14 L66 23.5 L56.5 14 Z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>
  <line x1="75" y1="14" x2="82" y2="14" stroke="currentColor" stroke-width="2.8"/>
  <circle cx="88" cy="14" r="5.4" fill="none" stroke="currentColor" stroke-width="4.4"/>
</svg>
