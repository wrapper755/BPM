[project]
name = "bpm-core"
version = "0.1.0"
description = "런타임 코어 — BPMN 실행, 확장 호스트, AI 태스크, 도구, 재생 기억, 설정 로더"
requires-python = ">=3.12,<3.13"
# openpyxl: 파일 출력 `format: xlsx` (C14).
# httpx: 서비스 앱 호출 (C11). 서버 실행기·Center도 같은 것을 쓴다.
# bpm-llm: 모델 클라이언트 (ADR-0034 — 서비스 앱과 같은 한 벌).
dependencies = ["bpm-extension-api", "bpm-llm", "httpx>=0.27", "openpyxl>=3.1", "pypdf>=5.1"]

[tool.uv.sources]
bpm-extension-api = { workspace = true }
bpm-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# bpm는 PEP 420 네임스페이스 — src/bpm 밑에 __init__.py를 두지 않는다
packages = ["src/bpm"]
